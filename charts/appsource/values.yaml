controllers:
  main:
    replicas: 2
    revisionHistoryLimit: 1
    containers:
      main:
        image:
          repository: ghcr.io/bhuism/appsource
          tag: "latest"
          pullPolicy: Always
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /
            port: 8080
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 100m
            memory: 64Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 8080

ingress:
  main:
    enabled: true
    className: nginx-external
    annotations:
      external-dns.kubernetes.io/target: jasmine.odee.net
      external-dns.kubernetes.io/cloudflare-proxied: "false"
      cert-manager.io/cluster-issuer: letsencrypt-production
      nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
      gethomepage.dev/enabled: "true"
    hosts:
      - host: www.appsource.nl
        paths:
          - path: /
            pathType: ImplementationSpecific
            service:
              identifier: main
              port: http
    tls:
      - secretName: www.appsource.nl
        hosts:
          - www.appsource.nl
