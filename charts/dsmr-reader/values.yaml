controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/xirixiz/dsmr-reader-docker
          pullPolicy: IfNotPresent
          tag: "6.2.1"
        env:
          TZ: "Europe/Amsterdam"
          VIRTUAL_HOST: localhost
          DISABLE_NGINX_ACCESS_LOGS: true
          ENABLE_HTTP_AUTH: false
          DJANGO_DATABASE_ENGINE: django.db.backends.postgresql
          DJANGO_DATABASE_NAME: dsmr-reader
          DJANGO_DATABASE_HOST: postgresql-rw.cloudnative-pg
          DJANGO_DATABASE_USER: dsmr-reader
          DJANGO_DATABASE_PASSWORD: dsmr-reader-password
          DJANGO_DATABASE_PORT: 5432
          DSMRREADER_ADMIN_USER: root
          DSMRREADER_ADMIN_PASSWORD: killer
          PGSSLCERT: /tmp/postgresql.crt
          DSMRREADER_REMOTE_DATALOGGER_INPUT_METHOD: ipv4
          DSMRREADER_REMOTE_DATALOGGER_NETWORK_HOST: 192.168.1.203
          DSMRREADER_REMOTE_DATALOGGER_NETWORK_PORT: 23
          DJANGO_SECRET_KEY: Mx2Ij81FjpTMNPFkGBaDO1sSxgm3Da1Z7yOdKWQuZvfPeAnBck

service:
  main:
    controller: main
    ports:
      http:
        port: 80

ingress:
  main:
    # enabled: true
    className: nginx-internal
    annotations:
      external-dns.kubernetes.io/target: ingress-internal.impl.nl
      external-dns.kubernetes.io/cloudflare-proxied: "false"
      cert-manager.io/cluster-issuer: letsencrypt-production
      gethomepage.dev/enabled: "true"
    hosts:
      - host: dsmr-reader.impl.nl
        paths:
          - path: /
            service:
              identifier: main
              port: http
    tls:
      - secretName: dsmr-reader.impl.nl
        hosts:
          - dsmr-reader.impl.nl
