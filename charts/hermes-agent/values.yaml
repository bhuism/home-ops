controllers:
  main:
    pod:
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: "OnRootMismatch"
    replicas: 1
    revisionHistoryLimit: 1
    initContainers:
      init-permissions:
        image:
          repository: busybox
          tag: "1.37"
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        command:
          - /bin/sh
          - -c
          - |
            chown -Rf 10000:10000 /opt/data || true
            chown -Rf 10000:10000 /run && chmod -f 755 /run || exit 1
    containers:
      main:
        image:
          repository: nousresearch/hermes-agent
          pullPolicy: IfNotPresent
          tag: "v0.23.1"
        tty: true
        stdin: true
        resources:
          limits:
            cpu: 2
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        securityContext:
          runAsUser: 10000
          runAsGroup: 10000
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
          HERMES_HOME: "/opt/data"
          HERMES_UID: "10000"
          HERMES_GID: "10000"
          TZ: "Europe/Amsterdam"
          HERMES_DASHBOARD: "true"
          HERMES_DASHBOARD_HOST: "0.0.0.0"
          HERMES_DASHBOARD_PORT: "8642"
          GOOGLE_API_KEY:
            valueFrom:
              secretKeyRef:
                name: google-ai-secret
                key: GOOGLE_API_KEY
service:
  main:
    controller: main
    ports:
      http:
        port: 8642
ingress:
  main:
    enabled: true
    className: nginx-internal
    annotations:
      external-dns.kubernetes.io/target: ingress-internal.impl.nl
      external-dns.kubernetes.io/cloudflare-proxied: "false"
      cert-manager.io/cluster-issuer: letsencrypt-production
    hosts:
      - host: hermes.impl.nl
        paths:
          - path: /
            pathType: ImplementationSpecific
            service:
              identifier: main
              port: http
    tls:
      - secretName: hermes.impl.nl
        hosts:
          - hermes.impl.nl

configMaps:
  hermes:
    enabled: true
    data:
      config.yaml: |
        terminal:
          backend: local
        model:
          provider: google
          default: gemini-3.8-flash
        auxiliary:
          provider: google
          model: gemini-2.5-flash
        gateway:
          session_recovery:
            restore_policy: ignore
        telemetry:
          shared_metrics:
            enabled: true
        dashboard:
          basic_auth:
            username: admin
            password_hash: "scrypt$16384$8$1$h9CeLv5+wsFydE9g43i+lA==$XXGUicJ+8rQbwv4Bq9ewtPvlvbWdsHNXZDg/rwYHUlc="
persistence:
  run:
    enabled: true
    type: emptyDir
    globalMounts:
      - path: /run
  data:
    enabled: true
    storageClass: "ceph-rbd"
    accessMode: ReadWriteOnce
    size: 20Gi
    globalMounts:
      - path: /opt/data
  config:
    enabled: true
    type: configMap
    identifier: hermes
    globalMounts:
      - path: /opt/data/config.yaml
        subPath: config.yaml
        readOnly: true
