controllers:
  main:
    type: statefulset
    containers:
      main:
        image:
          repository: eclipse-mosquitto
          tag: "2.1.2-alpine"
          pullPolicy: IfNotPresent
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
      ui:
        image:
          repository: smeagolworms4/mqtt-explorer
          tag: "browser-1.0.3"
          pullPolicy: IfNotPresent
        env:
          PORT: "4000"
        probes:
          liveness:
            enabled: true
            type: TCP
            port: 4000
            spec:
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness:
            enabled: true
            type: TCP
            port: 4000
            spec:
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          startup:
            enabled: true
            type: TCP
            port: 4000
            spec:
              initialDelaySeconds: 0
              periodSeconds: 5
              timeoutSeconds: 1
              failureThreshold: 30
configMaps:
  config:
    enabled: true
    data:
      mosquitto.conf: |
        per_listener_settings false
        allow_anonymous false
        persistence true
        persistence_location /mosquitto/data
        autosave_interval 1800
        include_dir /mosquitto/configinc
        password_file /mosquitto/configinc/passwordfile
        listener 1883
        protocol mqtt
        listener 8083
        protocol websockets
service:
  main:
    controller: main
    type: LoadBalancer
    annotations:
      lbipam.cilium.io/ips: "192.168.1.84"
    ports:
      http:
        enabled: false
      mqtt:
        enabled: true
        port: 1883
      websocket:
        enabled: true
        port: 8083
      ui:
        enabled: true
        port: 4000

ingress:
  main:
    enabled: true
    className: nginx-internal
    annotations:
      external-dns.kubernetes.io/target: ingress-internal.impl.nl
      external-dns.kubernetes.io/cloudflare-proxied: "false"
      cert-manager.io/cluster-issuer: letsencrypt-production
      gethomepage.dev/enabled: "true"
      gethomepage.dev/group: "Infrastructure"
      gethomepage.dev/name: "Mosquitto"
    hosts:
      - host: mosquitto.impl.nl
        paths:
          - path: /
            pathType: ImplementationSpecific
            service:
              name: main
              port: ui
    tls:
      - secretName: mosquitto.impl.nl
        hosts:
          - mosquitto.impl.nl

persistence:
  configinc:
    type: persistentVolumeClaim
    existingClaim: mosquitto-inc-v4-pvc
    advancedMounts:
      main:
        main:
          - path: /mosquitto/configinc
  data:
    type: persistentVolumeClaim
    existingClaim: mosquitto-data-v4-pvc
    advancedMounts:
      main:
        main:
          - path: /mosquitto/data
  config:
    enabled: true
    type: configMap
    name: mosquitto-config
    advancedMounts:
      main:
        main:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
  ui-config:
    enabled: true
    type: emptyDir
    advancedMounts:
      main:
        ui:
          - path: /mqtt-explorer/config
