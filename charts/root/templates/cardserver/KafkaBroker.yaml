apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: kafkabroker
  namespace: cardserver
  labels:
    strimzi.io/cluster: cardserver
spec:
  replicas: 3
  roles:
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 16Gi
        class: ceph-rbd
        kraftMetadata: shared
  template:
    pod:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: strimzi.io/name
                      operator: In
                      values:
                        - cardserver-kafka
                topologyKey: kubernetes.io/hostname
