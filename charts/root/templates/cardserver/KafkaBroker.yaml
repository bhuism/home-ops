apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker-controller
  namespace: cardserver
  labels:
    strimzi.io/cluster: cardserver
spec:
  replicas: 3
  roles:
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 50Gi
        class: ceph-rbd
        kraftMetadata: shared
