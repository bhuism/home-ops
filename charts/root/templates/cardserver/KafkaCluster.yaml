apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: cardserver
  namespace: cardserver
spec:
  kafka:
    version: 4.3.0
{{/*    metadataVersion: 4.3-IV0*/}}
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    
      # Increase the time a follower waits before assuming the leader is dead
      controller.quorum.fetch.timeout.ms: 10000
      
      # Increase the election timeout bounds to prevent rapid-fire elections
      controller.quorum.election.timeout.ms: 10000
      controller.quorum.election.backoff.max.ms: 5000
  
  
  entityOperator:
    topicOperator: {}
    userOperator: {}
