apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2advertisement
  namespace: kube-system
spec:
  serviceSelector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
  externalIPs: false
  loadBalancerIPs: true
  interfaces:
    - ^end0\.41$
    - ^enp4s0\.41$
