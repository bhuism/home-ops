apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  project: default
  source:
    chart: cilium
    repoURL: https://helm.cilium.io/
    targetRevision: 1.19.5
    helm:
      values: |
        externalIPs:
          enabled: true
        ipam:
          mode: kubernetes
          # https://github.com/cilium/cilium/issues/35811
          multiPoolPreAllocation: null
        l2announcements:
          enabled: true
        kubeProxyReplacement: true
        loadBalancer:
          mode: hybrid
          acceleration: best-effort
        routingMode: native
        ipv4NativeRoutingCIDR: 10.10.0.0/16
        k8sServiceHost: 127.0.0.1
        k8sServicePort: 7445
        autoDirectNodeRoutes: true
        bpf:
          masquerade: true
          # hostLegacyRouting: false
          # disableExternalIPMitigation: true
        securityContext:
          capabilities:
            ciliumAgent:
              - CHOWN
              - KILL
              - NET_ADMIN
              - NET_RAW
              - IPC_LOCK
              - SYS_ADMIN
              - SYS_RESOURCE
              - DAC_OVERRIDE,
              - FOWNER
              - SETGID
              - SETUID
            cleanCiliumState:
              - NET_ADMIN
              - SYS_ADMIN
              - SYS_RESOURCE
        cgroup:
          autoMount:
            enabled: false
          hostRoot: /sys/fs/cgroup

        rollOutCiliumPods: true

        k8sClientRateLimit:
          qps: 50
          burst: 100

        devices:
          - end0+
          - enp4s0+
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
