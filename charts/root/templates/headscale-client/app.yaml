apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headscale-client
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: headscale-client
  project: default
  source:
    repoURL: https://johanneskastl.github.io/helm-charts/
    chart: tailscale
    targetRevision: 0.38.0
    helm:
      valuesObject:
        env:
          TZ: "Europe/Amsterdam"
          TS_ROUTES: "10.10.50.0/24"
          TS_EXTRA_ARGS: "--login-server=https://headscale.impl.nl --snat-subnet-routes=true --accept-dns=false"
          TS_USERSPACE: "false"
          TS_PORT: "41641"
          TS_AUTH_ONCE: "true"
        service:
          main:
            enabled: true
            type: LoadBalancer
            externalTrafficPolicy: Cluster
            annotations:
              lbipam.cilium.io/ips: "192.168.1.87"
            ports:
              http:
                enabled: false
              tailscale-udp:
                enabled: true
                port: 41641
                protocol: UDP
                targetPort: 41641

        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: true
          capabilities:
            add:
              - NET_ADMIN
              - NET_RAW
        persistence:
          tun:
            enabled: true
            type: hostPath
            hostPath: /dev/net/tun
            mountPath: /dev/net/tun
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
