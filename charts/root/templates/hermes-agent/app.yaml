apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-agent
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  project: default
  source:
    repoURL: https://github.com/bhuism/home-ops.git
    path: charts/hermes-agent
    targetRevision: HEAD
    helm:
      values:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true