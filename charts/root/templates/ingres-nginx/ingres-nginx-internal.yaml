apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx-internal
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  project: default
  source:
    chart: ingress-nginx
    repoURL: https://kubernetes.github.io/ingress-nginx
    targetRevision: 4.14.3
    helm:
      valuesObject:
        controller:
          name: nginx-internal
          replicaCount: 3
          minAvailable: 1
          ingressClassResource:
            name: nginx-internal
            enabled: true
            controllerValue: k8s.io/nginx-internal
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
          service:
            externalTrafficPolicy: Local
            annotations:
              lbipam.cilium.io/ips: "10.10.41.101"
          config:
            proxy-body-size: "8m"
        defaultBackend:
          enabled: true
          name: defaultbackend
          image:
            repository: ghcr.io/tarampampam/error-pages
            tag: "3.3.1"
          extraEnvs:
            - name: SEND_SAME_HTTP_CODE
              value: "true"
            - name: SHOW_DETAILS
              value: "true"
          resources:
            requests:
              memory: 250Mi
              cpu: 250m
            limits:
              memory: 350Mi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
