apiVersion: operator.knative.dev/v1beta1
kind: KnativeEventing
metadata:
  name: knative-eventing
  namespace: knative-eventing
spec:
  source:
    kafka:
      enabled: true
    ceph:
      enabled: false
    github:
      enabled: false
    gitlab:
      enabled: false
    rabbitmq:
      enabled: false
    redis:
      enabled: false
