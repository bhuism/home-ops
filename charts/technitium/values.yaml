controllers:
  main:
    containers:
      main:
        image:
          repository: technitium/dns-server
          tag: "15.6.2"
          pullPolicy: Always
        env:
          TZ: "Europe/Amsterdam"
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 5380
              initialDelaySeconds: 5
              periodSeconds: 5
              failureThreshold: 20
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 5380
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 5380
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 1Gi

service:
  main:
    enabled: true
    annotations:
      lbipam.cilium.io/ips: "10.10.41.82"
    controller: main
    primary: true
    type: LoadBalancer
    externalTrafficPolicy: Local
    ports:
      http:
        enabled: true
        port: 5380
        protocol: TCP
      dns-tcp:
        enabled: true
        port: 53
        protocol: TCP
      dns-udp:
        enabled: true
        port: 53
        protocol: UDP

ingress:
  main:
    enabled: true
    annotations:
      external-dns.kubernetes.io/target: ingress-internal.impl.nl
      external-dns.kubernetes.io/cloudflare-proxied: "false"
      cert-manager.io/cluster-issuer: letsencrypt-production
    className: nginx-internal
    hosts:
      - host: technitium-dnsserver.impl.nl
        paths:
          - path: /
            service:
              identifier: main
              port: http
    tls:
      - hosts:
          - technitium-dnsserver.impl.nl
        secretName: technitium-dnsserver.impl.nl

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: technitium-config
    globalMounts:
      - path: /etc/dns
