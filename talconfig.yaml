clusterName: impl-k8s
talosVersion: v1.13.9
kubernetesVersion: v1.35.0
endpoint: https://control.impl.nl:6443
allowSchedulingOnControlPlanes: false
cniConfig:
  name: none
additionalMachineCertSans:
  - 127.0.0.1
  - 192.168.1.11
  - 192.168.1.153
  - 192.168.1.154
  - 192.168.1.155
  - 192.168.1.156
  - 192.168.1.157
  - 192.168.1.158
  - 192.168.1.159
  - control.impl.nl
  - node1.impl.nl
  - node2.impl.nl
  - node3.impl.nl
  - node4.impl.nl
  - jasmine.odee.net
  - control.impl.nl
additionalApiServerCertSans:
  - 127.0.0.1
  - 192.168.1.11
  - 192.168.1.153
  - 192.168.1.154
  - 192.168.1.155
  - 192.168.1.156
  - 192.168.1.157
  - 192.168.1.158
  - 192.168.1.159
  - control.impl.nl
  - node1.impl.nl
  - node2.impl.nl
  - node3.impl.nl
  - node4.impl.nl
  - jasmine.odee.net
  - control.impl.nl

patches:
  - |-
    machine:
      features:
        hostDNS:
          enabled: true
          forwardKubeDNSToHost: false
          resolveMemberNames: true
      kubelet:
        extraArgs:
          rotate-server-certificates: "true"
      kernel:
        modules:
          - name: nbd
          - name: rbd
          - name: ceph
      sysctls:
        net.ipv6.conf.all.forwarding: "1"
        net.ipv6.conf.default.forwarding: "1"
        net.ipv6.conf.all.accept_ra: "2"
        net.ipv6.conf.default.accept_ra: "2"
    cluster:
      proxy:
        disabled: true


controlPlane:
  nameservers:
    - 1.0.0.1
    - 8.8.4.4
    - 8.8.8.8

worker:
  nameservers:
    - 1.0.0.1
    - 8.8.4.4
    - 8.8.8.8

nodes:
  - hostname: node37
    ipAddress: 192.168.1.37
    controlPlane: false
    installDisk: /dev/mmcblk0
    networkInterfaces:
      - interface: end0
        addresses:
          - 192.168.1.37/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
            metric: 1024
        mtu: 1500
