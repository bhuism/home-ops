clusterName: impl-k8s
talosVersion: v1.13.12
kubernetesVersion: v1.35.0
endpoint: https://control.impl.nl:6443
allowSchedulingOnControlPlanes: false
cniConfig:
  name: none
additionalMachineCertSans:
  - 127.0.0.1
  - 10.10.41.33
  - 10.10.41.34
  - 10.10.41.35
  - 10.10.41.36
  - 10.10.41.37
  - 10.10.41.38
  - 10.10.41.39
  - 10.10.41.40
  - 10.10.41.41
  - control.impl.nl
additionalApiServerCertSans:
  - 127.0.0.1
  - 10.10.41.33
  - 10.10.41.34
  - 10.10.41.35
  - 10.10.41.36
  - 10.10.41.37
  - 10.10.41.38
  - 10.10.41.39
  - 10.10.41.40
  - 10.10.41.41
  - control.impl.nl
patches:
  - |-
    machine:
      features:
        hostDNS:
          enabled: true
          forwardKubeDNSToHost: false
          resolveMemberNames: true
      sysctls:
        net.ipv6.conf.all.forwarding: "1"
        net.ipv6.conf.default.forwarding: "1"
        net.ipv6.conf.all.accept_ra: "2"
        net.ipv6.conf.default.accept_ra: "2"
        net.ipv4.conf.all.rp_filter: "2"
        net.ipv4.conf.default.rp_filter: "2"
      kernel:
        modules:
          - name: nbd
          - name: rbd
          - name: ceph
    cluster:
      proxy:
        disabled: true




controlPlane:
  nameservers:
    - 1.0.0.1
    - 8.8.4.4
    - 8.8.8.8

worker:
  nameservers:
    - 1.0.0.1
    - 8.8.4.4
    - 8.8.8.8

nodes:
  - hostname: node33
    ipAddress: 10.10.41.33
    controlPlane: true
    installDisk: /dev/mmcblk0
    networkInterfaces:
      - interface: end0
        dhcp: false
        vlans:
          - vlanId: 41
            addresses:
              - 10.10.41.33/24
            routes:
              - gateway: 10.10.41.1
